<!doctype html>
<html lang="en">

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var theme = stored === 'dark' ? 'dark' : 'light';
        document.documentElement.classList.toggle('dark', theme === 'dark');
      })();
    </script>

    <!-- SEO -->
    <link rel="canonical" href="https://www.airella.org/" />

    <!-- Open Graph (social sharing) -->
    <meta property="og:title" content="Airella Tech – Software, AI, ML & Cloud Solutions" />

    <meta property="og:url" content="https://www.airella.org/" />
    <meta property="og:site_name" content="Airella Tech" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://www.airella.org/og-image.png" />

    <!-- Twitter -->
